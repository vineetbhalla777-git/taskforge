server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Proxy the API through the same origin the dashboard is served from, so the
    # browser's default (same-origin) API base just works with no manual config and
    # no CORS needed for this deployment path. `api` is the docker-compose service
    # name, resolved via Docker's internal DNS -- only reachable from inside the
    # compose network, which is exactly where nginx runs.
    #
    # The hostname is put in a variable (not a bare `proxy_pass http://api:8000;`)
    # deliberately: a literal proxy_pass target is resolved once, at nginx startup,
    # so if this container starts before `api`'s DNS entry exists (a real race even
    # with `depends_on`, and inevitable if `api` ever restarts), nginx fails to start
    # or holds a stale IP. Routing through a variable defers resolution to request
    # time against Docker's embedded DNS (127.0.0.11), so nginx starts regardless of
    # startup order and keeps working across the api container being restarted.
    resolver 127.0.0.11 valid=10s;
    location ~ ^/(v1|metrics|healthz)(/|$) {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
